replicaCount: 2

image:
  repository: jayanthrx/devops-flask-app
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: NodePort
  port: 5000
  targetPort: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

probes:
  liveness:
    path: /health
    port: 5000
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /health
    port: 5000
    initialDelaySeconds: 5
    periodSeconds: 10

metrics:
  enabled: true
  path: /metrics
  port: 5000
